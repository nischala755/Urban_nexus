# Demo deployment. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: urban-nexus
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: urban-nexus-db
          property: connectionString

databases:
  - name: urban-nexus-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: urbannexus
    user: urban
    ipAllowList: []

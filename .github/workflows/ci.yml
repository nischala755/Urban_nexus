name: Prototype verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urban
          POSTGRES_PASSWORD: local-test
          POSTGRES_DB: urbannexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U urban -d urbannexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://urban:local-test@localhost:5432/urbannexus_test
      - run: python scripts/demo.py --skip-sumo
      - run: python scripts/evaluate.py
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-evidence
          path: artifacts/
